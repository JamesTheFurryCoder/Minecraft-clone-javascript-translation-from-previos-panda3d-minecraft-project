<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babylon Minecraft Clone</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #111827;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }

      #fps {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 1;
        padding: 6px 9px;
        color: #f1f5f9;
        background: rgba(17, 24, 39, 0.8);
        font: 12px/1.2 monospace;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fps">0 fps</div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/main.js"></script>
  </body>
</html>
